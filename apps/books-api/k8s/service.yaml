apiVersion: v1
kind: Service
metadata:
  name: books-api
spec:
  selector:
    app: books-api
  ports:
    - protocol: TCP
      port: 80        # Port exposed inside the cluster
      targetPort: 8080 # Port your Go app is listening on
  type: LoadBalancer   # Linode will automatically provision a Cloud Load Balancer with a Public IP
